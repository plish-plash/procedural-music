[package]
name = "pm-theory"
description = "Music theory core for the procedural music node graph: tunings, pitches, scales, chords, rhythms, progressions."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `std` only adds frequency conversion (needs floating-point powf).
# Everything else builds with `--no-default-features` for microcontrollers.
default = ["std"]
std = []

