[package]
name = "pm-app"
description = "Procedural Music: desktop node-graph app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "procedural-music"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `custom-protocol` serves the UI from the files embedded in the binary, so a plain
# `cargo run` works without the Tauri CLI or a dev server.
tauri = { version = "2", features = ["custom-protocol"] }
midir = "0.10"
rfd = "0.15"
cpal = "0.15"
pm-engine = { path = "../crates/engine" }
pm-synth = { path = "../crates/synth" }

# The app is its own workspace so the engine crates still build and test without
# downloading Tauri. Build it with: cargo build --manifest-path app/Cargo.toml

[workspace]

[profile.release]
lto = true

# Audio code must keep up in real time even in debug builds.
[profile.dev.package.pm-synth]
opt-level = 3

[profile.dev.package.pm-engine]
opt-level = 2

[profile.dev.package.pm-theory]
opt-level = 2

# The counterpoint solver searches thousands of lines; unoptimized it is ~20x slower.
[profile.dev.package.pm-counterpoint]
opt-level = 3
